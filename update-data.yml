name: Update MGNREGA data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download government list
        run: |
          curl -L --fail --retry 3 \
          "https://mnregaweb2.dord.gov.in/Netnrega/writereaddata/citizen_out/panchregpeople_1816002028_local2627.html" \
          -o data.html

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.html
          git diff --cached --quiet || git commit -m "Update MGNREGA Adgaon list"
          git push
