<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मनरेगा नोंदणी यादी - आडगाव</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f5f7fb;color:#222}
.header{background:#fff;border-bottom:1px solid #ddd;padding:18px 14px;text-align:center}
.header h1{margin:0 0 8px;font-size:24px}
.header p{margin:4px 0;color:#555}
.searchbox{position:sticky;top:0;z-index:10;background:#f5f7fb;padding:12px}
.searchbox input{width:100%;max-width:850px;display:block;margin:auto;padding:14px 16px;border:2px solid #1769aa;border-radius:10px;font-size:18px;outline:none}
.buttons{text-align:center;padding:0 12px 12px}
button{padding:10px 18px;border:0;border-radius:8px;background:#1769aa;color:white;font-size:15px;cursor:pointer;margin:4px}
button.secondary{background:#666}
.status{text-align:center;padding:8px;color:#555}
.tablewrap{overflow:auto;background:#fff;margin:0 10px 20px;border:1px solid #ddd}
table{border-collapse:collapse;width:100%;min-width:1450px;font-size:13px}
th,td{border:1px solid #bbb;padding:7px 8px;vertical-align:top}
th{background:#e9eef5;position:sticky;top:69px;z-index:5}
.noresult{text-align:center;padding:30px;font-size:18px;color:#a00}
.small{font-size:12px;color:#777}
@media(max-width:600px){.header h1{font-size:19px}.searchbox input{font-size:16px}table{font-size:12px}}
</style>
</head>
<body>
<div class="header">
  <h1>Registration Application Register</h1>
  <p>राज्य : MAHARASHTRA | जिल्हा : JALNA | तालुका : BHOKARDAN | Panchayat : Adgaon</p>
  <p>गाव : अद्गओन | एकूण नोंदणी : <b id="total">लोड होत आहे...</b></p>
</div>

<div class="searchbox">
  <input id="search" type="search" placeholder="🔍 नाव शोधा..." autocomplete="off">
</div>
<div class="buttons">
  <button onclick="showAll()">सर्व यादी</button>
  <button class="secondary" onclick="clearSearch()">Search Clear</button>
</div>
<div class="status" id="status">यादी लोड होत आहे...</div>

<div class="tablewrap">
<table id="dataTable">
<thead></thead>
<tbody></tbody>
</table>
<div class="noresult" id="noresult" style="display:none">नाव सापडले नाही.</div>
</div>

<script>
let rows=[];
let headers=[];

function clean(s){return (s||'').replace(/\s+/g,' ').trim();}

function render(list){
  const tbody=document.querySelector("#dataTable tbody");
  tbody.innerHTML="";
  list.forEach(r=>{
    const tr=document.createElement("tr");
    r.forEach(v=>{
      const td=document.createElement("td");
      td.textContent=clean(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById("noresult").style.display=list.length?"none":"block";
  document.getElementById("status").textContent=`दिसणाऱ्या नोंदी: ${list.length}`;
}

function makeHeader(){
  const thead=document.querySelector("#dataTable thead");
  thead.innerHTML="";
  const tr=document.createElement("tr");
  headers.forEach(h=>{
    const th=document.createElement("th");
    th.textContent=clean(h);
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function search(){
  const q=clean(document.getElementById("search").value).toLowerCase();
  if(!q){render(rows);return;}
  // Search only in applicant name column (column 4), as requested.
  const result=rows.filter(r=>clean(r[3]).toLowerCase().includes(q));
  render(result);
}

function showAll(){document.getElementById("search").value="";render(rows);}
function clearSearch(){showAll();document.getElementById("search").focus();}
document.getElementById("search").addEventListener("input",search);

async function loadData(){
  try{
    const res=await fetch("data.html?ts="+Date.now());
    if(!res.ok) throw new Error("data.html not found");
    const text=await res.text();
    const doc=new DOMParser().parseFromString(text,"text/html");
    const table=doc.querySelector("table");
    if(!table) throw new Error("Government table not found");
    const trs=[...table.querySelectorAll("tr")];
    // Find the table header row containing "Name of Applicant"
    let headerIndex=trs.findIndex(tr=>tr.innerText.includes("Name of Applicant"));
    if(headerIndex<0) headerIndex=0;
    headers=[...trs[headerIndex].querySelectorAll("th,td")].map(x=>clean(x.innerText));
    rows=trs.slice(headerIndex+1).map(tr=>[...tr.querySelectorAll("th,td")].map(x=>clean(x.innerText)))
      .filter(r=>r.length>=8 && /^\d+$/.test(r[0]));
    makeHeader();
    document.getElementById("total").textContent=rows.length || "2555";
    render(rows);
  }catch(e){
    document.getElementById("status").textContent="यादी लोड झाली नाही. GitHub Action एकदा Run करा.";
    document.getElementById("total").textContent="—";
    console.error(e);
  }
}
loadData();
</script>
</body>
</html>
